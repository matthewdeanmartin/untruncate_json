[project]
name = "untruncate_json"
version = "1.1.0"
description = "Make truncated json valid again by adding missing closing characters."
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Matthew Martin", email = "matthewdeanmartin@gmail.com" }]
keywords = ["json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = []

[project.urls]
Repository = "https://github.com/matthewdeanmartin/untruncate_json"
Homepage = "https://matthewdeanmartin.github.io/untruncate_json/"
Documentation = "https://untruncate-json.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/matthewdeanmartin/untruncate_json/issues"
"Change Log" = "https://github.com/matthewdeanmartin/untruncate_json/blob/main/CHANGELOG.md"

[project.scripts]
untruncate_json = "untruncate_json.__main__:main"

[build-system]
requires = [
    "setuptools==80.9.0; python_version < '3.10'",
    "setuptools==84.2.1; python_version >= '3.10'",
    "mypy[mypyc]==1.19.1; python_version < '3.10'",
    "mypy[mypyc]==2.4.1; python_version >= '3.10'",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["untruncate_json*"]

[tool.setuptools.package-data]
untruncate_json = ["py.typed"]

[dependency-groups]
security = ["zizmor==1.32.0"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
release = ["keepachangelog-manager-fork==6.10.1"]
quality = ["ruff", "pylint>=3.0.0", "mypy>=1.6.1", "pytest>=7.4.3", "pytest-cov>=4.1.0", "hypothesis>=6.88.1", "bandit>=1.7.0"]
dev = [
    {include-group = "quality"},
    "setuptools",
    "jsonfixer>=0.2.2",
    "mypy>=1.6.1",
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "hypothesis[cli]>=6.88.1",
    "pre-commit>=3.5.0",
    "build>=1.0.3",
    "ruff",
    "jiggle-version>=2.1.0",
    "troml-dev-status>=0.6.0; python_version >= '3.9'",
    "dont-be-lazy>=0.1.2; python_version >= '3.10'",
    "pydoc-fork>=3.0.0; python_version >= '3.10'",
    "isort>=5.13.2",
    "black>=24.0.0",
    "bandit>=1.7.0",
    "pylint>=3.0.0",
    "keepachangelog-manager-fork[all]>=6.6.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.dependency-groups]
security = {requires-python = ">=3.11"}
docs = {requires-python = ">=3.11"}
release = {requires-python = ">=3.11"}

[tool.uv.pip]
universal = true
[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''
# Can't use poetry and mypyc together?
#[build-system]
#requires = ["poetry>=0.12"]
## build-backend = "poetry.masonry.api"
#build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
junit_family = "xunit1"
norecursedirs = [".*", "build", "dist", "vendor", "scripts", "venv"]
# don't know how to do this in toml
#addopts = "--strict-markers"
#markers =
#	slow: marks tests as slow (deselect with '-m "not slow"')
#	fast: marks tests as fast (deselect with '-m "not fast"')

[tool.isort]
default_section = "THIRDPARTY"
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = ["dedlin"]
line_length = 88
multi_line_output = 3
use_parentheses = true

[tool.ruff]
line-length = 320

# Exclude a variety of commonly ignored directories.
exclude = [
    "dead_code",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "hide"
]

target-version = "py39"

[tool.ruff.lint]
# Enable Pyflakes `E` and `F` codes by default.
select = ["E", "F"]
ignore = [
    "E722",
    "E501",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
strict = true

# changelogmanager (keepachangelog-manager-fork) drives the release workflows.
# See .github/workflows/create_draft_release.yml and build.yml.
[tool.changelogmanager.versioning]
scheme = "semver"

[tool.changelogmanager.validation]
enforce_preamble = true
format = "auto"

[tool.changelogmanager.defaults]
skip_ci = true
error_format = "github"
commit_schema = "keepachangelog"
schema_version = "current"

[[tool.changelogmanager.components]]
name = "default"
changelog = "CHANGELOG.md"
version_files = ["pyproject.toml", "untruncate_json/version.py"]

