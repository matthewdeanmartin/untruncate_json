[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_i686"]
build-frontend = "build"
test-requires = ["pytest", "hypothesis"]
test-command = [
    "python {project}/tests/check_native.py",
    "python -m pytest --import-mode=importlib {project}/tests",
]

[tool.cibuildwheel.environment]
MYPYC_OPT_LEVEL = "3"
