# Keep this filename: PyPI trusted publishing is registered to build.yml.
---
name: Release
concurrency:
  group: changelog
  cancel-in-progress: false
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  bump:
    name: Prepare release branch
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release branch or update the draft release.
      pull-requests: write # Open the version bump PR.
    outputs:
      branch: ${{ steps.release.outputs.branch }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.15'}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Sync dependencies
        run: uv sync --frozen --only-group release
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump, commit, push branch and open PR
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          BASE_BRANCH: ${{ github.event.release.target_commitish }}
          REPO: ${{ github.repository }}
        run: |
          # One command does everything the bump job used to do in shell:
          # bump changelog + version files, branch, [skip ci] commit,
          # --force-with-lease push, and open the release PR. The [skip ci]
          # decision follows [defaults].skip_ci (default true).
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          VERSION="${RELEASE_VERSION#v}"
          uv run --frozen --only-group release kaclm release-bump \
            --version "$VERSION" \
            --base "$BASE_BRANCH" \
            --release-id "$RELEASE_ID" \
            --repository "$REPO" \
            --open-pr \
            --title "chore: release ${VERSION}" \
            --body "Automated release PR for ${VERSION}. Merge once the PyPI publish succeeds." \
            --github-output --yes
  quality:
    needs: bump
    uses: $/.github/workflows/quality_gates.yml
    with:
      ref: ${{ needs.bump.outputs.branch }}
  build:
    needs: [bump, quality]
    uses: $/.github/workflows/build_wheels.yml
    with:
      ref: ${{ needs.bump.outputs.branch }}
      version: ${{ needs.bump.outputs.version }}
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Request the OIDC token for PyPI trusted publishing.
    environment:
      name: pypi
      url: https://pypi.org/p/untruncate-json
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: 'true'
