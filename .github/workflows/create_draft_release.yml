---
name: Create Draft Release
concurrency:
  group: changelog
  cancel-in-progress: false
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    name: Refresh draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release branch or update the draft release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.15'}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --only-group release
      - name: Creating Draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: uv run --frozen --only-group release kaclm github-release --repository "$REPOSITORY"
