name: Build wheels
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''
concurrency:
  group: build_wheels-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  wheels:
    name: Build and test native wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x86_64}
          - {os: ubuntu-24.04-arm, arch: aarch64}
          - {os: macos-15-intel, arch: x86_64}
          - {os: macos-latest, arch: arm64}
          - {os: windows-latest, arch: AMD64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          config-file: cibuildwheel.toml
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --sdist --python 3.15
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
  validate:
    name: Validate distributions
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx twine check --strict dist/*
      - name: Check complete artifact set and versions
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os
          from email.parser import BytesParser
          from zipfile import ZipFile
          from pathlib import Path
          from packaging.utils import parse_wheel_filename, parse_sdist_filename
          from packaging.version import Version
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 49, f'Expected 49 native wheels, got {len(wheels)}'
          assert len(list(Path('dist').glob('*.tar.gz'))) == 1
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  metadata_path = next(n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))
                  metadata = BytesParser().parsebytes(archive.read(metadata_path))
                  assert metadata['Description-Content-Type'] == 'text/markdown', wheel
          versions = set()
          for path in Path('dist').iterdir():
              parse = parse_wheel_filename if path.suffix == '.whl' else parse_sdist_filename
              versions.add(parse(path.name)[1])
          assert len(versions) == 1, versions
          if os.environ['EXPECTED']:
              assert versions == {Version(os.environ['EXPECTED'])}, versions
          PY
